<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Journal</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --border-color: #dcdfe6;
            --text-color: #2c3e50;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --accent-color: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .main-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            min-width: 0;
        }
        .sidebar {
            flex: 0.6;
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            box-sizing: border-box;
            min-width: 200px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .current-date {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .search-container {
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-bar {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }
        .search-nav-btn {
            background: #7f8c8d;
            color: white;
            padding: 10px 14px;
            font-size: 0.9rem;
            border-radius: 6px;
            white-space: nowrap;
        }
        .search-nav-btn:hover {
            background: #6c7a7d;
        }
        .search-count-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #7f8c8d;
            min-width: 70px;
            text-align: center;
        }
        .entry-box {
            background: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .editor-container {
            position: relative;
        }
        .editor {
            width: 100%;
            min-height: 120px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            resize: vertical;
            outline: none;
            background: #fff;
        }
        .editor[placeholder]:empty:before {
            content: attr(placeholder);
            color: #aaa;
        }
        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .select-container-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .select-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #fff;
        }
        .delete-opt-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            display: inline-flex;
            align-items: center;
        }
        .delete-opt-btn:hover {
            color: #c0392b;
        }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }
        .btn-complete {
            background-color: #27ae60;
            color: white;
        }
        .btn-delete-entry {
            background-color: #e74c3c;
            color: white;
        }
        .entries-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .journal-card {
            background: white;
            border-radius: 8px;
            padding: 15px 20px;
            border: 1px solid var(--border-color);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #7f8c8d;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }
        .card-tags {
            display: flex;
            gap: 5px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-cat { background: #e8f4fd; color: #1e88e5; }
        .badge-tag { background: #e8f8f5; color: #2ecc71; }
        .card-body {
            white-space: pre-wrap;
            line-height: 1.5;
            max-height: 350px;
            overflow-y: auto;
            overflow-x: auto;
            word-break: normal;
            background: #fafbfc;
            padding: 10px;
            border-radius: 4px;
        }
        mark.wj-highlight {
            background-color: #ffeb3b;
            color: #000;
            padding: 1px 0;
            border-radius: 2px;
        }
        mark.wj-highlight-active {
            background-color: #ff9800 !important;
            color: #fff !important;
            font-weight: bold;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        .sidebar-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-section h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .scrollable-filter-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #f0f2f5;
            border-radius: 6px;
            padding: 5px;
            background: #fafbfc;
        }
        .filter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .filter-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .filter-item:hover, .filter-item.active {
            background: #eaf2f8;
            color: var(--primary-color);
            font-weight: bold;
        }
        .date-picker-btn {
            background: #f1c40f;
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            margin: 0 4px;
            display: inline-flex;
            align-items: center;
        }
        .inline-calendar-input {
            position: absolute;
            visibility: hidden;
            width: 0;
            height: 0;
        }
        .follow-up-item {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 4px;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }
        .follow-up-item:hover {
            background: #eaf2f8;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="main-panel">
        <div class="header">
            <div class="current-date" id="live-date"></div>
            <div><strong>Work Journal</strong></div>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search entries instantly... words will highlight yellow..." oninput="handleSearchChange()">
            <span class="search-count-label" id="search-count">0 / 0</span>
            <button class="search-nav-btn" onclick="navigateSearch(-1)">◀ Prev</button>
            <button class="search-nav-btn" onclick="navigateSearch(1)">Next ▶</button>
            <button onclick="clearSearch()" style="background: #e74c3c; color: white;">✖ Stop</button>
        </div>

        <div class="entry-box" id="drop-zone">
            <!-- Directory Sync Row -->
            <div style="display: flex; gap: 10px; align-items: center; background: #fdf2e9; padding: 6px 12px; border-radius: 6px; border: 1px dashed #e67e22; font-size: 0.85rem;">
                <label for="base-directory-input" style="font-weight: bold; color: #d35400; white-space: nowrap;">📁 Base Folder Path:</label>
                <input type="text" id="base-directory-input" placeholder="Paste path here (e.g. C:\Users\Name\Documents\) to create complete folder links..." style="flex: 1; padding: 4px 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85rem; outline: none;">
            </div>

            <div class="editor-container">
                <div class="editor" id="entry-editor" contenteditable="true" placeholder="Type notes here... drag files/emails, type dates, or use Alt+D..."></div>
                <input type="date" id="hidden-cal" class="inline-calendar-input">
            </div>
            <div class="controls-row">
                <div class="select-container-wrapper">
                    <div class="select-group">
                        <label for="entry-category">Category:</label>
                        <select id="entry-category" onchange="handleCategoryChange(this)"></select>
                    </div>
                    <button class="delete-opt-btn" onclick="removeDropdownOption('entry-category', 'categories')" title="Delete selected item permanently from choices">🗑️</button>
                </div>

                <div class="select-container-wrapper">
                    <div class="select-group">
                        <label for="entry-tag">Tag:</label>
                        <select id="entry-tag" onchange="handleSelectAdd('entry-tag', 'tags')"></select>
                    </div>
                    <button class="delete-opt-btn" onclick="removeDropdownOption('entry-tag', 'tags')" title="Delete selected item permanently from choices">🗑️</button>
                </div>

                <button class="btn-primary" style="margin-left: auto;" onclick="saveEntry()" id="primary-save-btn">New Entry</button>
                <button class="btn-complete" id="complete-btn" style="display: none; margin-left: 10px;" onclick="markFollowUpComplete()">✓ Mark Complete</button>
                <button class="btn-delete-entry" id="delete-entry-btn" style="display: none; margin-left: 10px;" onclick="deleteCurrentEntry()">🗑️ Delete Entry</button>
            </div>
        </div>
        <div class="entries-feed" id="entries-container"></div>
    </div>

    <div class="sidebar">
        <div class="sidebar-section">
            <h3>Categories (Used)</h3>
            <div class="scrollable-filter-box">
                <ul class="filter-list" id="filter-categories"></ul>
            </div>
        </div>
        <div class="sidebar-section">
            <h3>Tags (Used)</h3>
            <div class="scrollable-filter-box">
                <ul class="filter-list" id="filter-tags"></ul>
            </div>
        </div>
        <!-- New FollowUp Section -->
        <div class="sidebar-section">
            <h3>Follow Ups</h3>
            <div class="scrollable-filter-box">
                <ul class="filter-list" id="follow-up-list"></ul>
            </div>
        </div>
<!-- === COPIED ADMIN SUITE DECK BOUNDARY START === -->
        <div class="admin-action-deck" style="display: flex; flex-direction: column; gap: 8px; border-top: 2px dashed var(--border-color); padding-top: 15px; margin-top: auto;">
            <button onclick="exportDataBackup()" style="background: #27ae60; color: white; font-weight: bold; width: 100%;">📤 Export Backup JSON</button>

            <!-- Safe JSON Data Restoration File Hook -->
            <input type="file" id="json-archive-import" accept=".json" style="display: none;" onchange="importJsonArchiveFile(this)">
            <button onclick="document.getElementById('json-archive-import').click()" style="background: #2980b9; color: white; font-weight: bold; width: 100%;">⏮️ Restore Backup JSON</button>

            <input type="file" id="txt-file-import" accept=".txt" style="display: none;" onchange="importTextFile(this)">
            <button onclick="document.getElementById('txt-file-import').click()" style="background: #9b59b6; color: white; font-weight: bold; width: 100%;">📥 Import TXT File</button>

            <button onclick="deleteAllEntriesWithBackup()" style="background: #c0392b; color: white; font-weight: bold; width: 100%;">🗑️ Delete ALL Entries</button>
        </div>
<!-- === COPIED ADMIN SUITE DECK BOUNDARY END === -->
    </div>
<script>
        console.log("--- Local Storage Debug Info ---");
        const rawEntriesFromLocalStorage = localStorage.getItem('wj_entries');
        console.log("Raw 'wj_entries' from localStorage:", rawEntriesFromLocalStorage);

        let parsedEntries = [];
        try {
            parsedEntries = rawEntriesFromLocalStorage ? JSON.parse(rawEntriesFromLocalStorage) : [];
            console.log("Parsed 'wj_entries' from localStorage:", parsedEntries);
        } catch (e) {
            console.error("Error parsing 'wj_entries' from localStorage:", e);
            parsedEntries = [];
        }

        var defaultCats = ["ToDo", "FollowUp", "General", "Meetings"];
        var defaultTags = ["Project A", "Admin", "Urgent", "file", "e-mail"];

        var savedCats = JSON.parse(localStorage.getItem('wj_categories'));
        var savedTags = JSON.parse(localStorage.getItem('wj_tags'));

        if (!savedCats || !Array.isArray(savedCats) || savedCats.length === 0) {
            savedCats = defaultCats;
            localStorage.setItem('wj_categories', JSON.stringify(defaultCats));
        }
        if (!savedTags || !Array.isArray(savedTags) || savedTags.length === 0) {
            savedTags = defaultTags;
            localStorage.setItem('wj_tags', JSON.stringify(defaultTags));
        }

        var state = {
            categories: savedCats,
            tags: savedTags,
            entries: JSON.parse(localStorage.getItem('wj_entries')) || [],
            activeCategoryFilter: "All",
            activeTagFilter: "All"
        };
        console.log("Final state.entries after initialization:", state.entries);
        console.log("------------------------------");

        // Helper function to normalize FollowUp category variations
        function isFollowUpCategory(category) {
            if (!category) return false;
            var normalized = category.toLowerCase().trim().replace(/[\s-]/g, '');
            return normalized === 'followup';
        }

        var editingId = null;
        var activeHighlightIndex = -1;
        var totalHighlightCount = 0;

        const editor = document.getElementById('entry-editor');
        const catSelect = document.getElementById('entry-category');
        const tagSelect = document.getElementById('entry-tag');
        const entriesContainer = document.getElementById('entries-container');
        const filterCatList = document.getElementById('filter-categories');
        const filterTagList = document.getElementById('filter-tags');
        const hiddenCal = document.getElementById('hidden-cal');
        const followUpList = document.getElementById('follow-up-list'); // New

        window.addEventListener('DOMContentLoaded', function() {
            updateDate();
            populateDropdowns();
            renderFilters();
            renderEntries();
            renderFollowUps(); // New
            setupDragAndDrop();
            setupDateDetection();
        });

        function updateDate() {
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date').innerText = new Date().toLocaleDateString(undefined, options);
        }

/* === COPIED SORTING DROPDOWN SYSTEM BOUNDARY START === */
        function populateDropdowns() {
            // Create cloned copies of the arrays and sort them alphabetically
            var sortedCats = state.categories.slice().sort(function(a, b) {
                return a.toLowerCase().localeCompare(b.toLowerCase());
            });
            var sortedTags = state.tags.slice().sort(function(a, b) {
                return a.toLowerCase().localeCompare(b.toLowerCase());
            });

            // Populate the selector dropdown views with the freshly sorted lists
            populateSelect(catSelect, sortedCats);
            populateSelect(tagSelect, sortedTags);
        }
/* === COPIED SORTING DROPDOWN SYSTEM BOUNDARY END === */

        function populateSelect(selectElem, optionArray) {
            var html = "";
            optionArray.forEach(function(opt) {
                if (opt) {
                    html += '<option value="' + opt + '">' + opt + '</option>';
                }
            });
            html += '<option value="__NEW__">+ Add New...</option>';
            selectElem.innerHTML = html;
        }
        function handleCategoryChange(selectElem) {
            if (selectElem.value === '__NEW__') {
                var newValue = prompt("Enter new value:");
                if (newValue && newValue.trim() !== "") {
                    var cleanValue = newValue.trim();
                    if (!state.categories.includes(cleanValue)) {
                        state.categories.push(cleanValue);
                        localStorage.setItem('wj_categories', JSON.stringify(state.categories));
                    }
                    populateDropdowns();
                    selectElem.value = cleanValue;
                    renderFilters();
                    renderFollowUps();
                } else { selectElem.selectedIndex = 0; }
            }
            
            // Auto-insert date when FollowUp category is selected
            if (isFollowUpCategory(selectElem.value) && !editor.innerHTML.includes('📅')) {
                insertCalendarAnchor();
            }
        }
        
        function handleSelectAdd(selectId, stateKey) {
            var selectElem = document.getElementById(selectId);
            if (selectElem.value === '__NEW__') {
                var newValue = prompt("Enter new value:");
                if (newValue && newValue.trim() !== "") {
                    var cleanValue = newValue.trim();
                    if (!state[stateKey].includes(cleanValue)) {
                        state[stateKey].push(cleanValue);
                        localStorage.setItem('wj_' + stateKey, JSON.stringify(state[stateKey]));
                    }
                    populateDropdowns();
                    selectElem.value = cleanValue;
                    renderFilters();
                    renderFollowUps(); // New
                } else { selectElem.selectedIndex = 0; }
            }
        }

        function removeDropdownOption(selectId, stateKey) {
            var selectElem = document.getElementById(selectId);
            var targetVal = selectElem.value;
            if (!targetVal || targetVal === '__NEW__') {
                alert("Please select a valid choice to delete.");
                return;
            }
            if (confirm('Are you sure you want to delete "' + targetVal + '" from choices? Old entries will be safe.')) {
                state[stateKey] = state[stateKey].filter(function(opt) { return opt !== targetVal; });
                localStorage.setItem('wj_' + stateKey, JSON.stringify(state[stateKey]));
                populateDropdowns();
                renderFilters();
                renderEntries();
                renderFollowUps(); // New
            }
        }

        function exportDataBackup() {
            var packageData = { categories: state.categories, tags: state.tags, entries: state.entries };
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(packageData, null, 2));
            var dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "WorkJournal_Backup_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function deleteAllEntriesWithBackup() {
            if (state.entries.length === 0) { alert("Your workspace feed is empty."); return; }
            if (confirm("⚠️ WARNING: This will permanently wipe all entries! A backup JSON file will download first. Proceed?")) {
                exportDataBackup();
                if (confirm("Confirming download: Did you save the backup package? Click OK to purge cache.")) {
                    state.entries = [];
                    localStorage.setItem('wj_entries', JSON.stringify(state.entries));
                    clearSearch();
                    renderFilters();
                    renderEntries();
                    renderFollowUps(); // New
                }
            }
        }

        function saveEntry() {
            var content = editor.innerHTML.trim();
            if (!content) return;

            // Require date for "FollowUp" category
            if (isFollowUpCategory(catSelect.value) && !editor.innerHTML.includes('📅')) {
                // Use insertCalendarAnchor to insert the date button with full functionality
                const tempContent = editor.innerHTML;
                editor.innerHTML = '';
                insertCalendarAnchor();
                editor.innerHTML = editor.innerHTML + tempContent;
                alert("A date has been automatically added. Please verify it's correct, then save again.");
                editor.focus();
                return;
            }

            if (editingId) {
                var targetIndex = state.entries.findIndex(function(entry) { return entry.id === editingId; });
                if (targetIndex !== -1) {
                    state.entries[targetIndex].content = content;
                    state.entries[targetIndex].category = catSelect.value;
                    state.entries[targetIndex].tag = tagSelect.value;
                    state.entries[targetIndex].basePath = document.getElementById('base-directory-input').value;
                }
                editingId = null;
                var primarySaveBtn = document.getElementById('primary-save-btn');
                if (primarySaveBtn) primarySaveBtn.innerText = "New Entry";
                document.getElementById('complete-btn').style.display = "none";
                document.getElementById('delete-entry-btn').style.display = "none";
            } else {
                var newEntry = {
                    id: Date.now(),
                    date: new Date().toLocaleString(),
                    content: content,
                    category: catSelect.value,
                    tag: tagSelect.value,
                    basePath: document.getElementById('base-directory-input').value
                };
                state.entries.unshift(newEntry);
            }

            localStorage.setItem('wj_entries', JSON.stringify(state.entries));
            editor.innerHTML = "";
            catSelect.selectedIndex = 0;
            tagSelect.selectedIndex = 0;
            document.getElementById('base-directory-input').value = "";
            renderFilters();
            renderEntries();
            renderFollowUps(); // New
        }

        function updateFileLinksWithBasePath(content, basePath) {
            if (!basePath) return content;
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var links = tempDiv.querySelectorAll('a[href^="file:///"]');
            links.forEach(function(link) {
                var currentHref = link.getAttribute('href');
                var fileName = currentHref.split('/').pop();
                var newPath = basePath.replace(/\\/g, '/');
                if (!newPath.endsWith('/')) newPath += '/';
                link.setAttribute('href', 'file:///' + newPath + fileName);
            });
            return tempDiv.innerHTML;
        }

        function editEntry(id) {
            var targetEntry = state.entries.find(function(entry) { return entry.id === id; });
            if (!targetEntry) return;

            editingId = id;
            
            // Restore the base path for this entry first
            document.getElementById('base-directory-input').value = targetEntry.basePath || "";
            
            // Update file links in content to use the entry's base path
            var updatedContent = updateFileLinksWithBasePath(targetEntry.content, targetEntry.basePath);
            editor.innerHTML = updatedContent;
            
            catSelect.value = targetEntry.category;
            tagSelect.value = targetEntry.tag;

            var primarySaveBtn = document.getElementById('primary-save-btn');
            if (primarySaveBtn) primarySaveBtn.innerText = "Update Entry";

            // Show/hide complete button based on category
            var completeBtn = document.getElementById('complete-btn');
            if (isFollowUpCategory(targetEntry.category)) {
                completeBtn.style.display = "inline-flex";
            } else {
                completeBtn.style.display = "none";
            }

            // Show delete button when editing
            document.getElementById('delete-entry-btn').style.display = "inline-flex";

            editor.focus();
        }

        function markFollowUpComplete() {
            if (!editingId) return;

            var targetIndex = state.entries.findIndex(function(entry) { return entry.id === editingId; });
            if (targetIndex === -1) return;

            // Save any edited content and change category to completed
            state.entries[targetIndex].content = editor.innerHTML.trim();
            state.entries[targetIndex].category = "FollowUp - Completed";
            state.entries[targetIndex].tag = tagSelect.value;

            // Ensure "FollowUp - Completed" is in the categories list
            if (!state.categories.some(function(cat) { return cat.toLowerCase() === "followup - completed"; })) {
                state.categories.push("FollowUp - Completed");
                localStorage.setItem('wj_categories', JSON.stringify(state.categories));
            }

            localStorage.setItem('wj_entries', JSON.stringify(state.entries));
            editingId = null;
            editor.innerHTML = "";
            catSelect.selectedIndex = 0;
            tagSelect.selectedIndex = 0;
            document.getElementById('primary-save-btn').innerText = "New Entry";
            document.getElementById('complete-btn').style.display = "none";
            document.getElementById('delete-entry-btn').style.display = "none";
            document.getElementById('base-directory-input').value = "";
            populateDropdowns();
            renderFilters();
            renderEntries();
            renderFollowUps();
        }

        function deleteCurrentEntry() {
            if (!editingId) return;
            if (!confirm("Are you sure you want to delete this entry? This cannot be undone.")) return;

            var targetIndex = state.entries.findIndex(function(entry) { return entry.id === editingId; });
            if (targetIndex === -1) return;

            state.entries.splice(targetIndex, 1);
            localStorage.setItem('wj_entries', JSON.stringify(state.entries));
            editingId = null;
            editor.innerHTML = "";
            catSelect.selectedIndex = 0;
            tagSelect.selectedIndex = 0;
            document.getElementById('primary-save-btn').innerText = "New Entry";
            document.getElementById('complete-btn').style.display = "none";
            document.getElementById('delete-entry-btn').style.display = "none";
            document.getElementById('base-directory-input').value = "";
            renderFilters();
            renderEntries();
            renderFollowUps();
        }

        function importTextFile(input) {
            const file = input.files;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const rawEntries = e.target.result.split(/\n\s*\n/);
                rawEntries.forEach((block, index) => {
                    if (block.trim()) {
                        state.entries.unshift({
                            id: Date.now() + index,
                            date: new Date().toLocaleString(),
                            content: block.trim().replace(/\n/g, '<br>'),
                            category: "General", tag: "file"
                        });
                    }
                });
                localStorage.setItem('wj_entries', JSON.stringify(state.entries));
                renderFilters(); renderEntries(); renderFollowUps(); // New
                alert('Successfully imported from ' + file.name + '!');
                input.value = "";
            };
            reader.readAsText(file);
        }
/* === COPIED JSON PARSER RECOVERY ENGINE START === */
        function importJsonArchiveFile(input) {
            var file = input.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var parsedData = JSON.parse(e.target.result);

                    // Verify data schema integrity before merging into storage cache vectors
                    if (!parsedData || !Array.isArray(parsedData.entries)) {
                        alert("Error: Invalid ledger architecture. This file does not match a proper Work Journal export format.");
                        return;
                    }

                    if (confirm("Found " + parsedData.entries.length + " entries inside backup archive ledger. Would you like to merge this package data into your current active local journal memory cache?")) {
                        // Unpack and reconstruct the Categories array tracking sets safely
                        if (parsedData.categories && Array.isArray(parsedData.categories)) {
                            parsedData.categories.forEach(function(cat) {
                                if (cat && !state.categories.includes(cat)) state.categories.push(cat);
                            });
                            localStorage.setItem('wj_categories', JSON.stringify(state.categories));
                        }

                        // Unpack and reconstruct the Tags array tracking sets safely
                        if (parsedData.tags && Array.isArray(parsedData.tags)) {
                            parsedData.tags.forEach(function(tag) {
                                if (tag && !state.tags.includes(tag)) state.tags.push(tag);
                            });
                            localStorage.setItem('wj_tags', JSON.stringify(state.tags));
                        }

                        // Unpack cards, checking for duplicate matching IDs to avoid overlapping entries
                        parsedData.entries.forEach(function(backupEntry) {
                            var duplicateCheck = state.entries.some(function(existing) {
                                return existing.id === backupEntry.id;
                            });
                            if (!duplicateCheck) {
                                state.entries.push(backupEntry);
                            }
                        });

                        // Sort combined log feeds chronologically (newest at top)
                        state.entries.sort(function(a, b) { return b.id - a.id; });
                        localStorage.setItem('wj_entries', JSON.stringify(state.entries));

                        // Force layout interface reflow update events
                        populateDropdowns();
                        renderFilters();
                        renderEntries();
                        renderFollowUps(); // New

                        alert("Successfully unpacked and restored active history from " + file.name + "!");
                    }
                } catch (err) {
                    alert("Fatal: Failed to process ledger package string compilation. JSON payload data may be corrupted.");
                }
                input.value = "";
            };
            reader.readAsText(file);
        }
/* === COPIED JSON PARSER RECOVERY ENGINE END === */

        function handleSearchChange() { activeHighlightIndex = -1; renderEntries(); }
        function clearSearch() { document.getElementById('search-input').value = ""; handleSearchChange(); }

        function applyHighlighting(htmlText, query) {
            if (!query) return htmlText;
            const div = document.createElement('div');
            div.innerHTML = htmlText;
            const walkTextNodes = (node) => {
                if (node.nodeType === 3) {
                    const text = node.nodeValue;
                    if (text.toLowerCase().includes(query)) {
                        const span = document.createElement('span');
                        const regex = new RegExp('(' + query.replace(/[-\/\^$*+?.()|[\]{}]/g, '\$&') + ')', 'gi');
                        span.innerHTML = text.replace(regex, '<mark class="wj-highlight">$1</mark>');
                        node.parentNode.replaceChild(span, node);
                    }
                } else {
                    for (let i = 0; i < node.childNodes.length; i++) walkTextNodes(node.childNodes[i]);
                }
            };
            walkTextNodes(div); return div.innerHTML;
        }
        function renderEntries() {
            entriesContainer.innerHTML = "";
            var query = document.getElementById('search-input').value.toLowerCase().trim();

            var filtered = state.entries.filter(function(entry) {
                var catMatch = state.activeCategoryFilter === "All" || entry.category === state.activeCategoryFilter;
                var tagMatch = state.activeTagFilter === "All" || entry.tag === state.activeTagFilter;
                var textContent = entry.content.toLowerCase();
                var dateContent = entry.date.toLowerCase();
                return catMatch && tagMatch && (!query || textContent.includes(query) || dateContent.includes(query));
            });

            if (filtered.length === 0) {
                entriesContainer.innerHTML = '<div style="text-align:center; color:#95a5a6; padding:20px;">No matching entries found.</div>';
                document.getElementById('search-count').innerText = "0 / 0";
                return;
            }

            filtered.forEach(function(entry) {
                var card = document.createElement('div');
                card.className = 'journal-card';
                var processedContent = applyHighlighting(entry.content, query);

                var cardHTML = '<div class="card-header">' +
                               '<div>' + entry.date + '</div>' +
                               '<div class="card-tags">' +
                               '<span class="badge badge-cat">' + entry.category + '</span>' +
                               '<span class="badge badge-tag">' + entry.tag + '</span>' +
                               '<button onclick="editEntry(' + entry.id + ')" style="padding: 2px 6px; font-size: 0.75rem; margin-left: 8px; background: #f39c12; color: white; border-radius: 4px; border:none; cursor:pointer;">Edit</button>' +
                               '</div>' +
                               '</div>' +
                               '<div class="card-body">' + processedContent + '</div>';

                card.innerHTML = cardHTML;
                entriesContainer.appendChild(card);
            });

            var highlights = entriesContainer.querySelectorAll('mark.wj-highlight');
            totalHighlightCount = highlights.length;
            if (totalHighlightCount > 0) {
                if (activeHighlightIndex < 0) activeHighlightIndex = 0;
                if (activeHighlightIndex >= totalHighlightCount) activeHighlightIndex = totalHighlightCount - 1;
                highlights[activeHighlightIndex].classList.add('wj-highlight-active');
                highlights[activeHighlightIndex].scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                document.getElementById('search-count').innerText = (activeHighlightIndex + 1) + " / " + totalHighlightCount;
            } else {
                activeHighlightIndex = -1; document.getElementById('search-count').innerText = "0 / 0";
            }
        }

        function navigateSearch(direction) {
            if (totalHighlightCount === 0) return;
            activeHighlightIndex += direction;
            if (activeHighlightIndex >= totalHighlightCount) activeHighlightIndex = 0;
            if (activeHighlightIndex < 0) activeHighlightIndex = totalHighlightCount - 1;
            renderEntries();
        }

/* === COPIED ALPHABETICAL SIDEBAR FILTERS BOUNDARY START === */
        function renderFilters() {
            // Start with empty sets so the sidebar ONLY lists items found in your entries
            var usedCategories = new Set(); 
            var usedTags = new Set();
            
            // Loop through active logs to dynamically harvest whatever choices are written
            state.entries.forEach(function(entry) {
                if (entry.category) usedCategories.add(entry.category);
                if (entry.tag) usedTags.add(entry.tag);
            });

            // Convert sets to standard arrays and apply strict alphabetical sorting models
            var sortedCategoriesArray = Array.from(usedCategories).sort(function(a, b) {
                return a.toLowerCase().localeCompare(b.toLowerCase());
            });
            var sortedTagsArray = Array.from(usedTags).sort(function(a, b) {
                return a.toLowerCase().localeCompare(b.toLowerCase());
            });

            // Re-render the sidebars cleanly with alphabetized tracking sets
            renderFilterGroup(filterCatList, sortedCategoriesArray, state.activeCategoryFilter, function(val) {
                state.activeCategoryFilter = val; renderFilters(); renderEntries();
            });
            renderFilterGroup(filterTagList, sortedTagsArray, state.activeTagFilter, function(val) {
                state.activeTagFilter = val; renderFilters(); renderEntries();
            });
        }
/* === COPIED ALPHABETICAL SIDEBAR FILTERS BOUNDARY END === */

        function renderFilterGroup(element, itemsArray, activeValue, clickHandler) {
            element.innerHTML = "";
            var sortedItems = itemsArray.sort();
            var items = ["All"];
            sortedItems.forEach(function(item) { items.push(item); });

            items.forEach(function(item) {
                var li = document.createElement('li');
                li.className = 'filter-item' + (item === activeValue ? ' active' : '');
                li.innerText = item;
                li.onclick = function() { clickHandler(item); };
                element.appendChild(li);
            });
        }

        // Helper function to extract date from entry content
        function extractDateFromEntry(content) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const dateMatch = tempDiv.innerHTML.match(/📅\s*([A-Za-z]+,\s*[A-Za-z]+\s*\d+,\s*\d{4})/);
            if (dateMatch) {
                return new Date(dateMatch[1]);
            }
            return new Date(0); // Return epoch if no date found (will sort to bottom)
        }

        // New: Render Follow-Up entries in the sidebar
        function renderFollowUps() {
            followUpList.innerHTML = "";
            var followUpEntries = state.entries.filter(entry => isFollowUpCategory(entry.category));

            if (followUpEntries.length === 0) {
                followUpList.innerHTML = '<li style="text-align:center; color:#95a5a6; padding:10px;">No active follow-ups.</li>';
                return;
            }

            // Sort by date in entry (earliest first), entries without dates go to bottom
            followUpEntries.sort(function(a, b) {
                var dateA = extractDateFromEntry(a.content);
                var dateB = extractDateFromEntry(b.content);
                // If both have dates, sort by date
                if (dateA.getTime() !== new Date(0).getTime() && dateB.getTime() !== new Date(0).getTime()) {
                    return dateA - dateB;
                }
                // If only A has date, A comes first
                if (dateA.getTime() !== new Date(0).getTime()) return -1;
                // If only B has date, B comes first
                if (dateB.getTime() !== new Date(0).getTime()) return 1;
                // Neither has date, maintain original order
                return 0;
            });

            followUpEntries.forEach(function(entry) {
                var li = document.createElement('li');
                li.className = 'follow-up-item';
                // Extract first sentence or limited text
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = entry.content;
                let textContent = tempDiv.innerText.split('.')[0] + (tempDiv.innerText.includes('.') ? '.' : ''); // First sentence
                if (textContent.length > 70) { // Limit to a reasonable length
                    textContent = textContent.substring(0, 67) + '...';
                }
                li.innerText = textContent;
                li.onclick = function() { editEntry(entry.id); }; // Load entry into editor on click
                followUpList.appendChild(li);
            });
        }

         function setupDragAndDrop() {
            var dropZone = document.getElementById('drop-zone');
            var basePathInput = document.getElementById('base-directory-input');

            // Ensure base path starts empty for each entry
            if (basePathInput) {
                basePathInput.value = "";
            }

            var eventsGroup = ['dragenter', 'dragover'];
            eventsGroup.forEach(function(name) {
                dropZone.addEventListener(name, function(e) {
                    e.preventDefault(); dropZone.style.borderColor = "var(--primary-color)";
                });
            });

            var leaveGroup = ['dragleave', 'drop'];
            leaveGroup.forEach(function(name) {
                dropZone.addEventListener(name, function(e) {
                    e.preventDefault(); dropZone.style.borderColor = "var(--border-color)";
                });
            });

            window.copyLocalPath = function(btnElement, targetPath) {
                navigator.clipboard.writeText(targetPath).then(function() {
                    var originalText = btnElement.innerHTML; btnElement.innerHTML = "📋 Path Copied!";
                    btnElement.style.background = "#2ecc71";
                    setTimeout(function() { btnElement.innerHTML = originalText; btnElement.style.background = "#e74c3c"; }, 1200);
                });
            };

            dropZone.addEventListener('drop', function(e) {
                var detectedHTML = "", itemTag = "file";
                var htmlData = e.dataTransfer.getData('text/html');
                var textData = e.dataTransfer.getData('text/plain');

                // Fetch the manual directory base path text
                var baseDirectory = basePathInput ? basePathInput.value.trim() : "";
                if (baseDirectory && !baseDirectory.endsWith('\\') && !baseDirectory.endsWith('/')) {
                    baseDirectory += '\\'; // Enforce trailing slash logic automatically
                }

                if (e.dataTransfer.files.length > 0) {
                    Array.from(e.dataTransfer.files).forEach(function(file) {
                        // Combine base directory with file name for full path
                        var combinedPath = baseDirectory ? baseDirectory + file.name : file.name;
                        var filePathForLink = combinedPath.replace(/\\/g, '/');
                        detectedHTML += ' <a href="file:///' + filePathForLink + '" style="padding: 2px 6px; font-size: 0.85rem; background: #3498db; color: white; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; text-decoration: none;" title="Open file">📁 ' + file.name + '</a> ';
                    });
                    // Show warning after drop if base path is missing
                    if (!baseDirectory && e.dataTransfer.files.length > 0) {
                        setTimeout(function() {
                            alert('⚠️ Reminder: Please enter a Base Folder Path at the top of the entry box. The file link needs the full path to work correctly.');
                        }, 100);
                    }
                } else if (htmlData && (htmlData.includes('outlook') || htmlData.includes('mailto:'))) {
                    itemTag = "e-mail";
                    detectedHTML += ' ✉️ <strong>Dropped Email Reference:</strong> ' + (textData || 'View details') + ' ';
                } else if (textData) {
                    itemTag = textData.toLowerCase().includes('.eml') ? "e-mail" : "file";
                    if (textData.includes(':\\') || textData.startsWith('\\\\')) {
                        var filePathForLink = textData.replace(/\\/g, '/');
                        var fileName = textData.split(/[\\/]/).pop();
                        detectedHTML += ' <a href="file:///' + filePathForLink + '" style="padding: 2px 6px; font-size: 0.85rem; background: #3498db; color: white; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; text-decoration: none;" title="Open file">📁 ' + fileName + '</a> ';
                        detectedHTML += ' <a href="file:///' + filePathForLink + '" style="padding: 2px 6px; font-size: 0.85rem; background: #95a5a6; color: white; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; text-decoration: none;" title="Open file path">📂</a> ';
                    } else { detectedHTML += ' 🔗 <a href="' + textData + '" target="_blank">' + textData + '</a> '; }
                }
                if (detectedHTML) { editor.innerHTML += (editor.innerHTML ? "<br>" : "") + detectedHTML; tagSelect.value = itemTag; }
            });
        }

        function setupDateDetection() {
            window.addEventListener('keydown', (e) => {
                if (e.altKey && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); insertCalendarAnchor(); }
            });
            editor.addEventListener('input', () => {
                const text = editor.innerText;
                const datePattern = /\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})|(\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]* \d{1,2},? \d{4})\b/i;
                if (datePattern.test(text) && !editor.innerHTML.includes('📅')) { insertCalendarAnchor(); }
            });
        }

        function insertCalendarAnchor() {
            const uniqueId = "cal-" + Date.now();
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            hiddenCal.value = yyyy + '-' + mm + '-' + dd;
            const initialDate = today.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const btnHtml = '<button contenteditable="false" class="date-picker-btn" onclick="triggerInlineCalendar(\'' + uniqueId + '\')">📅 ' + initialDate + '</button><span id="' + uniqueId + '"></span>&nbsp;';
            editor.focus();
            document.execCommand('insertHTML', false, btnHtml);
            return btnHtml;
        }

        window.triggerInlineCalendar = function(targetId) {
            hiddenCal.style.visibility = "visible";
            const btnElement = document.getElementById(targetId).previousElementSibling;
            const rect = btnElement.getBoundingClientRect();
            hiddenCal.style.left = rect.left + window.scrollX + 'px'; hiddenCal.style.top = rect.top + window.scrollY + 'px';
            hiddenCal.showPicker();
            hiddenCal.onchange = function() {
                const parts = hiddenCal.value.split('-');
                const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]).toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                btnElement.innerHTML = '📅 ' + selectedDate;
                hiddenCal.style.visibility = "hidden";
            };
        }
    </script>

<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fuel Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <div class="top">
            <div class="stats">
                <h1>Fuel Log</h1>
                <div class="stat">
                    <span class="label">Running MPG</span>
                    <div id="running-mpg">--</div>
                </div>
            </div>

            <div class="controls" style="display: flex; gap: 8px; margin-left: auto;">
                <button id="btn-add-note" class="btn-ghost">Add Note</button>
                <button id="btn-export-json" class="btn-ghost">Export JSON</button>
            </div>
        </div>

        <div class="entry-editor" id="entry-editor">
            <h2 style="margin-top:0" id="editor-title">Add New Entry</h2>
            <form id="entry-form">
                <input type="hidden" id="entry-id">
                <input type="hidden" id="entry-is-note" value="false">
					<div class="form-grid">
						<label class="full-width">
							Date
							<input type="date" id="entry-date" required>
						</label>

						<div class="compact-row">
							<label class="compact-field">
								Odometer
								<input type="number" id="entry-odometer" required min="0" step="1">
							</label>

							<label class="compact-field">
								Gallons
								<input type="number" id="entry-gallons" required min="0.001" step="0.001">
							</label>

							<label class="compact-field">
								Price (Total)
								<input type="number" id="entry-price" required min="0" step="0.01">
							</label>
						</div>

						<label class="full-width" id="trip-checkbox-container" style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-weight: 500;">
							<input type="checkbox" id="entry-is-trip-end" style="width: auto; margin: 0;">
							Mark this entry as a Trip End point (Calculates stats back to previous Trip End)
						</label>
					</div>
                </div>

                <label>
                    Notes
                    <textarea id="entry-notes" rows="3"></textarea>
                </label>

                <div class="form-actions">
                    <button type="submit" id="btn-save">Save Entry</button>
                    <button type="button" class="btn-ghost" id="btn-cancel">Clear</button>
                    <button type="button" id="btn-delete" title="Delete Entry"
                        style="display:none;">Delete</button>
                </div>
            </form>
        </div>

        <ul class="entries" id="entries-list">
            <!-- Entries will be injected here -->
        </ul>
    </div>

    <script>
        /**
         * Fuel Log Application Logic
         */

        // State
        let entries = JSON.parse(localStorage.getItem('fuel-log-entries')) || [
            { id: '1', date: '2026-01-11', odometer: 1000, gallons: 12, price: 12, notes: '' },
            { id: '2', date: '2026-01-11', odometer: 1001, gallons: 11, price: 11, notes: 'Refill' }
        ];

        // DOM Elements
        const listEl = document.getElementById('entries-list');
        const mpgEl = document.getElementById('running-mpg');
        const formEl = document.getElementById('entry-form');
        const editorTitleEl = document.getElementById('editor-title');
        const btnCancel = document.getElementById('btn-cancel');
        const btnDelete = document.getElementById('btn-delete');
        const btnExport = document.getElementById('btn-export-json');
        const btnAddNote = document.getElementById('btn-add-note');

        // Init
        function init() {
            resetForm();
            render();
        }

        // Form Mode Helper
		 function setFormMode(isNote) {
			const isNoteEl = document.getElementById('entry-is-note');
			isNoteEl.value = isNote ? 'true' : 'false';

			const gallonsInput = document.getElementById('entry-gallons');
			const priceInput = document.getElementById('entry-price');
			const gallonsLabel = gallonsInput.closest('label');
			const priceLabel = priceInput.closest('label');
			const tripCheckboxContainer = document.getElementById('trip-checkbox-container');

			if (isNote) {
				editorTitleEl.innerText = document.getElementById('entry-id').value ? 'Edit Note' : 'Add New Note';
				gallonsLabel.style.display = 'none';
				priceLabel.style.display = 'none';
				tripCheckboxContainer.style.display = 'none';
				gallonsInput.removeAttribute('required');
				priceInput.removeAttribute('required');
			} else {
				editorTitleEl.innerText = document.getElementById('entry-id').value ? 'Edit Entry' : 'Add New Entry';
				gallonsLabel.style.display = 'block';
				priceLabel.style.display = 'block';
				tripCheckboxContainer.style.display = 'flex';
				gallonsInput.setAttribute('required', '');
				priceInput.setAttribute('required', '');
			}
		}

        // Rendering
        function render() {
            // Sort entries by odometer descending
            entries.sort((a, b) => b.odometer - a.odometer);

            // Save to LS
            localStorage.setItem('fuel-log-entries', JSON.stringify(entries));

            // Calculate Stats
            updateStats();

            // Render List
            listEl.innerHTML = '';
			entries.forEach(entry => {
				const li = document.createElement('li');
				li.className = 'entry';
				li.style.display = 'flex';
				li.style.flexDirection = 'column';
				li.style.gap = '8px';

				let mpgDisplay = '';
				if (!entry.isNote) {
					let prevRegularEntry = null;
					for (let i = entries.indexOf(entry) + 1; i < entries.length; i++) {
						if (!entries[i].isNote) {
							prevRegularEntry = entries[i];
							break;
						}
					}
					if (prevRegularEntry) {
						const dist = entry.odometer - prevRegularEntry.odometer;
						if (dist > 0 && entry.gallons > 0) {
							const mpg = dist / entry.gallons;
							mpgDisplay = `<div class="tag">${mpg.toFixed(1)} mpg</div>`;
						}
					}
				}

				// Trip Calculation Engine
				let tripSegmentLine = '';
				if (entry.isTripEnd && !entry.isNote) {
					let tripGallons = 0;
					let tripCost = 0;
					let startEntry = null;
					const currentIdx = entries.indexOf(entry);

					// Track backwards down the sorted array to find the prior trip endpoint boundary
					for (let i = currentIdx + 1; i < entries.length; i++) {
						if (!entries[i].isNote) {
							tripGallons += Number(entries[i-1].gallons);
							tripCost += Number(entries[i-1].price);
							if (entries[i].isTripEnd || i === entries.length - 1) {
								startEntry = entries[i];
								break;
							}
						}
					}

					// Complete data set for the segment found
					if (startEntry) {
						const tripDist = entry.odometer - startEntry.odometer;
						const tripMpg = tripGallons > 0 ? (tripDist / tripGallons).toFixed(2) : '0.00';
						tripSegmentLine = `
							<div style="margin-top: 4px; padding: 8px 12px; background: #f0fdf4; border-left: 4px solid #16a34a; border-radius: 4px; font-size: 0.85rem; color: #14532d; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;">
								<strong>🚩 Trip Summary Line:</strong>
								<span>Distance: <b>${tripDist.toLocaleString()} mi</b></span>
								<span>Total Cost: <b>$${tripCost.toFixed(2)}</b></span>
								<span>Trip Economy: <b>${tripMpg} MPG</b></span>
							</div>
						`;
					}
				}

				if (entry.isNote) {
					li.innerHTML = `
					<div style="display:flex; justify-content:space-between; width:100%;">
						<div class="entry-left">
							<div class="entry-meta">
								<strong>${entry.date}</strong>
								<span>${Number(entry.odometer).toLocaleString()} mi</span>
								<span style="background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 8px;">Note</span>
							</div>
							${entry.notes ? `<div class="small" style="margin-top: 4px; font-style: italic;">${entry.notes}</div>` : ''}
						</div>
						<div class="entry-right">
							<div class="entry-actions">
								<button class="btn-ghost" onclick="editEntry('${entry.id}')">Edit</button>
							</div>
						</div>
					</div>`;
				} else {
					const pricePerGallon = (entry.gallons > 0 && entry.price > 0)
						? (entry.price / entry.gallons).toFixed(3)
						: '0.000';

					li.innerHTML = `
					<div style="display:flex; justify-content:space-between; width:100%;">
						<div class="entry-left">
							<div class="entry-meta">
								<strong>${entry.date}</strong>
								<span>${Number(entry.odometer).toLocaleString()} mi</span>
								${entry.isTripEnd ? '<span style="background: #dcfce7; color: #16a34a; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 8px;">Trip End Point</span>' : ''}
							</div>
							${entry.notes ? `<div class="small">${entry.notes}</div>` : ''}
						</div>
						<div class="entry-right" style="text-align: right;">
							<div class="entry-actions" style="display: flex; gap: 4px; justify-content: flex-end; align-items: center;">
								${mpgDisplay}
								<button class="btn-ghost" onclick="editEntry('${entry.id}')">Edit</button>
							</div>
							<div class="small">$${Number(entry.price).toFixed(2)} • ${Number(entry.gallons).toFixed(3)} gal</div>
							<div class="small" style="color:#666; font-size:0.85rem;">$${pricePerGallon}/gal</div>
						</div>
					</div>
					${tripSegmentLine}`;
				}
				listEl.appendChild(li);
			});

        function updateStats() {
            // Filter out note entries for overall MPG stats
            const regularEntries = entries.filter(e => !e.isNote);

            if (regularEntries.length < 2) {
                mpgEl.innerText = '--';
                return;
            }

            const sorted = [...regularEntries].sort((a, b) => a.odometer - b.odometer);
            const first = sorted[0];
            const last = sorted[sorted.length - 1];

            const totalDist = last.odometer - first.odometer;
            let totalGallons = 0;
            for (let i = 1; i < sorted.length; i++) {
                totalGallons += Number(sorted[i].gallons);
            }

            if (totalGallons > 0) {
                mpgEl.innerText = (totalDist / totalGallons).toFixed(2);
            } else {
                mpgEl.innerText = '--';
            }
        }

        // Actions
		function resetForm() {
			formEl.reset();
			document.getElementById('entry-id').value = '';
			document.getElementById('entry-is-note').value = 'false';
			document.getElementById('entry-is-trip-end').checked = false;
			document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
			setFormMode(false);
			btnDelete.style.display = 'none';
			btnCancel.innerText = 'Clear';
		}

		function editEntry(id) {
			const entry = entries.find(x => x.id === id);
			if (entry) {
				document.getElementById('entry-id').value = entry.id;
				document.getElementById('entry-is-note').value = entry.isNote ? 'true' : 'false';
				document.getElementById('entry-date').value = entry.date;
				document.getElementById('entry-odometer').value = entry.odometer;
				document.getElementById('entry-gallons').value = entry.isNote ? '' : entry.gallons;
				document.getElementById('entry-price').value = entry.isNote ? '' : entry.price;
				document.getElementById('entry-notes').value = entry.notes || '';
				document.getElementById('entry-is-trip-end').checked = !!entry.isTripEnd;
				
				setFormMode(!!entry.isNote);

				btnDelete.style.display = 'block';
				btnCancel.innerText = 'Cancel';
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		}

		function saveEntry(e) {
			e.preventDefault();
			const id = document.getElementById('entry-id').value;
			const isNote = document.getElementById('entry-is-note').value === 'true';
			const data = {
				id: id || Date.now().toString(),
				date: document.getElementById('entry-date').value,
				odometer: Number(document.getElementById('entry-odometer').value),
				gallons: isNote ? 0 : Number(document.getElementById('entry-gallons').value),
				price: isNote ? 0 : Number(document.getElementById('entry-price').value),
				notes: document.getElementById('entry-notes').value,
				isNote: isNote,
				isTripEnd: isNote ? false : document.getElementById('entry-is-trip-end').checked
			};

			if (id) {
				const idx = entries.findIndex(x => x.id === id);
				if (idx !== -1) entries[idx] = data;
			} else {
				entries.push(data);
			}

			render();
			resetForm();
		}

        function deleteEntry() {
            if (!confirm('Are you sure you want to delete this entry?')) return;
            const id = document.getElementById('entry-id').value;
            entries = entries.filter(x => x.id !== id);
            render();
            resetForm();
        }

        // Events
        btnCancel.addEventListener('click', resetForm);
        formEl.addEventListener('submit', saveEntry);
        btnDelete.addEventListener('click', deleteEntry);

        btnAddNote.addEventListener('click', () => {
            resetForm();
            setFormMode(true);

            // Capture current date
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('entry-date').value = today;

            // Capture latest mileage
            if (entries.length > 0) {
                const maxOdom = Math.max(...entries.map(e => e.odometer));
                document.getElementById('entry-odometer').value = maxOdom;
            } else {
                document.getElementById('entry-odometer').value = '';
            }

            document.getElementById('entry-notes').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Quick Export
        btnExport.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "fuel_log_export.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });

        // Run
        init();

    </script>
</body>

</html>
